services:
  intake-agent:
    build:
      context: .
      dockerfile: services/intake-service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    volumes:
      - ./services/intake-service:/app
      - ./packages:/app/packages
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8001/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  lawyer-service:
    build:
      context: .
      dockerfile: services/lawyer-service/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    volumes:
      - ./services/lawyer-service:/app
      - ./packages:/app/packages
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8002/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./packages:/app/packages
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  telegram_bot:
    build:
      context: .
      dockerfile: services/bot-service/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - API_URL=http://intake-agent:8001
    volumes:
      - ./services/bot-service:/app
      - ./packages:/app/packages
    depends_on:
      - intake-agent
    profiles:
      - deprecated
    restart: no

  max-bot:
    build:
      context: .
      dockerfile: services/max-bot-service/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - API_URL=http://intake-agent:8001
    volumes:
      - ./services/max-bot-service:/app
      - ./packages:/app/packages
    depends_on:
      - intake-agent
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: always

  backend-tester:
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./packages:/app/packages
    profiles:
      - testing
