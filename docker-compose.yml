services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/venv
    restart: always

  telegram_bot:
    build: ./backend
    command: python bot.py
    env_file:
      - ./backend/.env
    environment:
      - API_URL=http://backend:8000
    volumes:
      - ./backend:/app
      - /app/venv
    depends_on:
      - backend
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: always
